<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>資訊卡</title>
<style>
  :root {
    --bg: #F2F4F0;
    --card: #FFFFFF;
    --border: #DCE2D8;
    --text: #1F231F;
    --muted: #667066;
    --accent: #2E6B4B;
    --accent-soft: #E4EFE7;
    --tag-bg: #EEF1EA;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141813;
      --card: #1C211B;
      --border: #2C332A;
      --text: #ECEFE9;
      --muted: #9AA69A;
      --accent: #6FCB98;
      --accent-soft: #23342A;
      --tag-bg: #212721;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 56px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { width: 100%; max-width: 420px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    margin-bottom: 16px;
  }

  .card-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 14px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .row:first-of-type { border-top: none; padding-top: 0; }

  .row-text { min-width: 0; }

  .row-title {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .row-value {
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    word-break: break-word;
    min-height: 1.2em;
  }

  .row-value.mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.02em;
  }

  .copy-btn {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--tag-bg);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .copy-btn:hover { border-color: var(--accent); }
  .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy-btn.done {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }

  .store-name {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 2px;
    min-height: 1.2em;
  }
  .store-code {
    display: inline-block;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 6px;
    margin-bottom: 14px;
  }

  .copy-all {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 15px;
    font-weight: 700;
    padding: 14px;
    border-radius: 12px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .copy-all:hover { opacity: 0.9; }
  .copy-all:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy-all.done { background: var(--accent); }

  .steps {
    margin: 18px 0 0;
    padding: 0 0 0 20px;
    font-size: 13px;
    line-height: 1.85;
    color: var(--muted);
  }
  .steps li::marker { color: var(--accent); font-weight: 700; }

  #shell { display: none; }
</style>
</head>
<body>

<div class="wrap" id="shell">
  <div class="card">
    <div class="card-label">收件人</div>
    <div class="row">
      <div class="row-text">
        <div class="row-title">姓名</div>
        <div class="row-value" data-f="n"></div>
      </div>
      <button class="copy-btn" data-copy="n">複製</button>
    </div>
    <div class="row">
      <div class="row-text">
        <div class="row-title">電話</div>
        <div class="row-value mono" data-f="p"></div>
      </div>
      <button class="copy-btn" data-copy="pr">複製</button>
    </div>
  </div>

  <div class="card">
    <div class="card-label">取件門市</div>
    <div class="store-name" data-f="s"></div>
    <div class="store-code" data-f="c"></div>

    <div class="row">
      <div class="row-text">
        <div class="row-title">地址</div>
        <div class="row-value" data-f="a"></div>
      </div>
      <button class="copy-btn" data-copy="ar">複製</button>
    </div>
    <div class="row">
      <div class="row-text">
        <div class="row-title">門市電話</div>
        <div class="row-value mono" data-f="t"></div>
      </div>
      <button class="copy-btn" data-copy="tr">複製</button>
    </div>
  </div>

  <button class="copy-all" id="copyAll">一鍵複製全部資訊</button>

  <ol class="steps">
    <li>到任何一間 7-ELEVEN，用 ibon 或 7-11 App 選「交貨便／店到店寄件」。</li>
    <li>寄件人填您自己的姓名與電話。</li>
    <li>收件人與取件門市，照上方資訊填寫即可。</li>
  </ol>
</div>

<script>
  var PAYLOAD = "eyJuIjoi546L5a6H5YWoIiwicCI6IjA5MjctNzc4LTk5OCIsInByIjoiMDkyNzc3ODk5OCIsInMiOiI3LUVMRVZFTiDnkZ7lhYnploDluIIiLCJjIjoi5bqX6JmfIDE5MjczOCIsImEiOiI5MDAg5bGP5p2x57ij5bGP5p2x5biC55Ge5YWJ6YeM5rCR55Sf5p2x6LevNTgtMuiZnyIsImFyIjoiOTAw5bGP5p2x57ij5bGP5p2x5biC55Ge5YWJ6YeM5rCR55Sf5p2x6LevNTgtMuiZnyIsInQiOiIwOC03MjEtMDk2MSIsInRyIjoiMDg3MjEwOTYxIn0=";

  function decodePayload(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  }

  var D = decodePayload(PAYLOAD);

  document.querySelectorAll("[data-f]").forEach(function (el) {
    el.textContent = D[el.getAttribute("data-f")];
  });
  document.getElementById("shell").style.display = "block";

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return legacyCopy(text);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  function flash(btn, doneLabel) {
    var original = btn.textContent;
    btn.textContent = doneLabel;
    btn.classList.add("done");
    setTimeout(function () {
      btn.textContent = original;
      btn.classList.remove("done");
    }, 1600);
  }

  document.querySelectorAll(".copy-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      copyText(D[btn.getAttribute("data-copy")]).then(function () { flash(btn, "已複製"); });
    });
  });

  document.getElementById("copyAll").addEventListener("click", function () {
    var btn = this;
    var text = [
      "收件人：" + D.n,
      "電話：" + D.pr,
      "",
      "取件門市：" + D.s + "（" + D.c + "）",
      "地址：" + D.ar,
      "門市電話：" + D.tr
    ].join("\n");
    copyText(text).then(function () { flash(btn, "已複製全部資訊"); });
  });
</script>

</body>
</html>
